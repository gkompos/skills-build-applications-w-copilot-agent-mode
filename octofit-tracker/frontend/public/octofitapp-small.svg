<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">OctoFit Tracker Logo</title>
  <desc id="desc">A rounded blue square with a wave stripe and the letters OF.</desc>
